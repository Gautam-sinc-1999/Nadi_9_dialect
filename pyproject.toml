[project]
name = "nadi9"
version = "0.1.0"
description = "Evidence-grounded agent that learns a low-resource dialect from an assignment pack and proposes reviewable subtitles."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
docx = ["python-docx>=1"]
anthropic = ["anthropic>=0.40"]
formats = ["pypdf>=4", "python-docx>=1"]
ui = ["streamlit>=1.40", "pandas>=2"]
dev = ["pytest>=8"]

[project.scripts]
nadi9 = "nadi9.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
